<!doctype html>
<html lang="en">
<head>
  <!-- arcade:head -->
</head>
<body>
<main data-arcade="bubbles">
  <!-- arcade:intro -->
  <section class="ag-game-shell">
    <div class="ag-toolbar">
      <div class="ag-hud" aria-label="Current game status">
        <div><span>score</span><strong id="score">0</strong></div>
        <div><span>shots</span><strong id="shots">0</strong></div>
        <div><span>best</span><strong id="best">0</strong></div>
        <div><span>state</span><strong id="message">ready</strong></div>
      </div>
      <div class="ag-buttons"><button class="ag-btn" id="restart" type="button">new game</button></div>
    </div>
    <div class="ag-stage">
      <!-- game/score/shots/best/message/restart are ids the vendor script looks up. -->
      <div class="ag-court"><canvas id="game" width="480" height="560"></canvas></div>
    </div>
    <p class="ag-hint">drag to aim · lift to fire</p>
  </section>
</main>
<script src="/arcade/bubble-shooter/game.js"></script>
<script src="/arcade-hud.js"></script>
<script src="/bubbles-adapter.js"></script>
</body>
</html>
