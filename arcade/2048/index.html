<!doctype html>
<html lang="en">
<head>
  <!-- arcade:head -->
  <link rel="stylesheet" href="/vendor-2048.css">
</head>
<body>
<main data-arcade="2048">
  <!-- arcade:intro -->
  <section class="ag-game-shell v2048-shell" aria-label="2048 play area">
    <div class="ag-toolbar">
      <div class="ag-hud" aria-label="Current game scores">
        <div><span>score</span><strong id="score">0</strong></div>
        <div><span>best</span><strong id="best">0</strong></div>
      </div>
      <div class="ag-buttons">
        <button class="ag-btn" id="newBtn" type="button">new game</button>
        <button class="ag-btn" id="shareBtn" type="button">share</button>
      </div>
    </div>
    <div class="v2048-medals" aria-label="Medals earned this game" aria-live="polite">
      <div id="medal-128" class="v2048-medal v2048-medal-128" hidden><span aria-hidden="true"></span><b>128</b></div>
      <div id="medal-256" class="v2048-medal v2048-medal-256" hidden><span aria-hidden="true"></span><b>256</b></div>
      <div id="medal-512" class="v2048-medal v2048-medal-512" hidden><span aria-hidden="true"></span><b>512</b></div>
      <div id="medal-1024" class="v2048-medal v2048-medal-1024" hidden><span aria-hidden="true"></span><b>1024</b></div>
      <div id="medal-2048" class="v2048-medal v2048-medal-2048" hidden><span aria-hidden="true"></span><b>2048</b></div>
      <div id="medal-4096" class="v2048-medal v2048-medal-4096" hidden><span aria-hidden="true"></span><b>4096</b></div>
    </div>
    <!-- board/score/best/newBtn/shareBtn/medal-* and msg* are ids the game script looks up. -->
    <div class="v2048-play"><div id="board" aria-label="2048 game board"></div></div>
    <p class="ag-hint">top edge: swipe to return</p>
  </section>
</main>

<div id="msg" role="dialog" aria-modal="true" aria-labelledby="msgTitle">
  <h2 id="msgTitle"></h2>
  <p id="msgSub"></p>
  <button class="ag-btn" type="button" onclick="startGame()">play again</button>
</div>
<script src="/vendor-2048.js"></script>
</body>
</html>
