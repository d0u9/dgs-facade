<!doctype html>
<html lang="en">
<head>
  <!-- arcade:head -->
  <link rel="stylesheet" href="/vendor-2048.css">
</head>
<body>
<main data-arcade="2048">
  <!-- arcade:intro -->
  <section class="ag-game-shell v2048-shell" aria-label="2048 play area">
    <div class="ag-toolbar">
      <div class="ag-hud" aria-label="Current game scores">
        <div><span>score</span><strong id="score">0</strong></div>
        <div><span>best</span><strong id="best">0</strong></div>
      </div>
      <div class="ag-buttons">
        <button class="ag-btn primary" id="newBtn" type="button">new game</button>
      </div>
    </div>
    <!-- data-style picks the medal look: "crest" (flat double-line shield, every
         milestone shown) or "classic" (metal shield, only reached ones shown).
         ?medals=classic or ?medals=crest in the URL overrides it. -->
    <div class="v2048-medals" data-style="crest" aria-label="Medals earned this game" aria-live="polite">
      <svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs>
        <path id="v2048-crest-outer" d="M20 2C26 2 31.5 3.6 35.6 5.4 37.1 6 38 7.4 38 9V22C38 32.6 30.6 40.6 20 46 9.4 40.6 2 32.6 2 22V9C2 7.4 2.9 6 4.4 5.4 8.5 3.6 14 2 20 2Z"/>
        <path id="v2048-crest-inner" d="M20 5.5C25 5.5 29.6 6.8 33 8.3 34.1 8.8 34.6 9.7 34.6 10.8V22C34.6 30.8 28.6 37.6 20 42.2 11.4 37.6 5.4 30.8 5.4 22V10.8C5.4 9.7 5.9 8.8 7 8.3 10.4 6.8 15 5.5 20 5.5Z"/>
      </defs></svg>
      <div id="medal-128" class="v2048-medal v2048-medal-128"><span aria-hidden="true"></span><b>128</b><svg class="v2048-crest" viewBox="0 0 40 48" aria-hidden="true"><use href="#v2048-crest-outer" class="outer"/><use href="#v2048-crest-inner" class="inner"/><path class="check" d="M16.5 14l2.5 2.5 5-5"/><text x="20" y="27">128</text></svg></div>
      <div id="medal-256" class="v2048-medal v2048-medal-256"><span aria-hidden="true"></span><b>256</b><svg class="v2048-crest" viewBox="0 0 40 48" aria-hidden="true"><use href="#v2048-crest-outer" class="outer"/><use href="#v2048-crest-inner" class="inner"/><path class="check" d="M16.5 14l2.5 2.5 5-5"/><text x="20" y="27">256</text></svg></div>
      <div id="medal-512" class="v2048-medal v2048-medal-512"><span aria-hidden="true"></span><b>512</b><svg class="v2048-crest" viewBox="0 0 40 48" aria-hidden="true"><use href="#v2048-crest-outer" class="outer"/><use href="#v2048-crest-inner" class="inner"/><path class="check" d="M16.5 14l2.5 2.5 5-5"/><text x="20" y="27">512</text></svg></div>
      <div id="medal-1024" class="v2048-medal v2048-medal-1024"><span aria-hidden="true"></span><b>1024</b><svg class="v2048-crest" viewBox="0 0 40 48" aria-hidden="true"><use href="#v2048-crest-outer" class="outer"/><use href="#v2048-crest-inner" class="inner"/><path class="check" d="M16.5 14l2.5 2.5 5-5"/><text x="20" y="27" class="n4">1024</text></svg></div>
      <div id="medal-2048" class="v2048-medal v2048-medal-2048"><span aria-hidden="true"></span><b>2048</b><svg class="v2048-crest" viewBox="0 0 40 48" aria-hidden="true"><use href="#v2048-crest-outer" class="outer"/><use href="#v2048-crest-inner" class="inner"/><path class="check" d="M16.5 14l2.5 2.5 5-5"/><text x="20" y="27" class="n4">2048</text></svg></div>
      <div id="medal-4096" class="v2048-medal v2048-medal-4096"><span aria-hidden="true"></span><b>4096</b><svg class="v2048-crest" viewBox="0 0 40 48" aria-hidden="true"><use href="#v2048-crest-outer" class="outer"/><use href="#v2048-crest-inner" class="inner"/><path class="check" d="M16.5 14l2.5 2.5 5-5"/><text x="20" y="27" class="n4">4096</text></svg></div>
    </div>
    <!-- board/score/best/newBtn/medal-* and msg* are ids the game script looks up. -->
    <div class="v2048-play"><div id="board" aria-label="2048 game board"></div></div>
    <p class="ag-hint">top edge: swipe to return</p>
  </section>
</main>

<div id="msg" role="dialog" aria-modal="true" aria-labelledby="msgTitle">
  <h2 id="msgTitle"></h2>
  <p id="msgSub"></p>
  <button class="ag-btn primary" type="button" onclick="startGame()">play again</button>
</div>
<script src="/vendor-2048.js"></script>
</body>
</html>
