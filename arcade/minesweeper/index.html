<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Clear the field with logic and mark every hidden mine."><meta name="referrer" content="no-referrer"><title>Minesweeper — DGS</title><link rel="stylesheet" href="/vendor-minesweeper.css"></head><body>
<main class="mine-page"><header class="mine-topbar"><a class="mine-brand" href="/" aria-label="DGS home"><i class="mine-mark" aria-hidden="true"></i><span>DGS / PLAYGROUND</span></a><div class="mine-status"><i aria-hidden="true"></i><span>GAME ONLINE</span></div></header>
<section class="mine-intro" aria-labelledby="game-title"><a class="mine-back" href="/arcade/" aria-label="Back to arcade"><span>←</span><span>arcade</span></a><div class="mine-copy"><div class="mine-eyebrow">logic puzzle</div><h1 id="game-title">Minesweeper</h1><p>Clear the field with logic. Mark every hidden mine without triggering one.</p></div><div class="mine-summary"><div class="stats"><div class="stat"><div class="l">Mines</div><div class="v" id="mineCount">0</div></div><div class="stat"><div class="l">Time</div><div class="v" id="timer">0</div></div><div class="stat"><div class="l">Best</div><div class="v" id="bestTime">—</div></div></div><div class="mine-actions"><button class="play-btn" onclick="newGame()">new game</button><a class="mine-exit" href="/arcade/">exit</a></div><div class="mine-note">click / tap · right click / long press to flag</div></div></section>
<section class="mine-stage" aria-label="Minesweeper play area"><div class="toolbar" role="group" aria-label="Difficulty"><button class="diff-btn active" data-d="beginner">Beginner 9×9</button><button class="diff-btn" data-d="intermediate">Intermediate 16×16</button><button class="diff-btn" data-d="expert">Expert 30×16</button></div><div class="mine-board-wrap"><div id="board"></div></div></section></main>
<div id="overlay" role="dialog" aria-modal="true" aria-labelledby="ovTitle"><h2 id="ovTitle"></h2><p id="ovSub"></p><button class="play-btn" onclick="newGame()">Play Again</button></div><script src="/vendor-minesweeper.js"></script></body></html>
