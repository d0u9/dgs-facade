<!doctype html>
<html lang="en">
<head>
  <!-- arcade:head -->
</head>
<body>
<main data-arcade="tower">
  <!-- arcade:intro -->
  <section class="ag-game-shell">
    <div class="ag-toolbar">
      <div class="ag-hud" aria-label="Current game status">
        <div><span>height</span><strong id="score">0</strong></div>
        <div><span>best</span><strong id="best">0</strong></div>
        <div><span>state</span><strong id="message">ready</strong></div>
      </div>
      <div class="ag-buttons"><button class="ag-btn primary" id="restart" type="button">new game</button></div>
    </div>
    <div class="ag-stage">
      <!-- game/score/best/message are ids the vendor script looks up. -->
      <div class="ag-court"><canvas id="game" width="420" height="560"></canvas></div>
    </div>
    <p class="ag-hint">tap anywhere to drop</p>
  </section>
</main>
<script src="/arcade/tower-blocks/game.js"></script>
<script src="/arcade-hud.js"></script>
<script src="/tower-adapter.js"></script>
</body>
</html>
