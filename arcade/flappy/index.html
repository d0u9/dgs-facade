<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0"><meta name="theme-color" content="#050610"><meta name="description" content="Play the open-source HTML5 Flappy Bird locally in your browser."><meta name="referrer" content="no-referrer"><title>Flappy Bird / Arcade / d0u9</title>
  <link rel="stylesheet" href="/flappy-integration.css">
</head>
<body>
<main class="flappy-page">
  <header class="flappy-topbar"><a class="flappy-brand" href="/arcade/"><i class="flappy-mark"></i><span>d0u9 / arcade / flappy</span></a><div class="flappy-status"><i></i><span>local only</span></div></header>
  <section class="flappy-intro"><a class="flappy-back" href="/arcade/"><span>←</span><span>Arcade</span></a><div class="flappy-copy"><div class="flappy-eyebrow">08 / open source arcade</div><h1>Flappy Bird</h1><p>Flap through the gaps. One touch is all the control you get.</p></div><div class="flappy-actions"><a class="flappy-exit" href="/arcade/">exit</a><span class="flappy-keys">SPACE / CLICK / TAP</span></div><div class="flappy-scroll-cue" aria-hidden="true"><span>scroll down to play</span><span>↓</span></div></section>
  <section class="flappy-game-shell">
    <div class="flappy-toolbar">
      <div class="flappy-stage-hud" aria-label="Current game status">
        <div><span>score</span><strong id="score">0</strong></div>
        <div><span>best</span><strong id="best">0</strong></div>
        <div><span>state</span><strong id="message">ready</strong></div>
      </div>
      <div class="flappy-buttons"><button class="flappy-btn" id="start" type="button">start</button><button class="flappy-btn" id="restart" type="button">restart</button></div>
    </div>
    <div id="flappy-stage">
      <!-- canvas/score/best/message/start/restart are ids the vendor script looks up. -->
      <div class="flappy-court"><canvas id="game" width="400" height="560"></canvas></div>
    </div>
    <p class="flappy-gesture-hint">tap anywhere to flap</p>
  </section>
</main>
<script src="/arcade/flappy/game.js"></script>
<script src="/flappy-status-adapter.js"></script>
</body>
</html>
