<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0"><meta name="theme-color" content="#050610"><meta name="description" content="Play the open-source Color Flood puzzle locally in your browser."><meta name="referrer" content="no-referrer"><title>Color Flood / Arcade / d0u9</title>
  <link rel="stylesheet" href="/arcade-shell.css">
</head>
<body>
<main class="ag-page" style="--game-accent:#c04dff; --court-ratio:1">
  <header class="ag-topbar"><a class="ag-brand" href="/arcade/"><i class="ag-mark"></i><span>d0u9 / arcade / flood</span></a><div class="ag-status"><i></i><span>local only</span></div></header>
  <section class="ag-intro"><a class="ag-back" href="/arcade/"><span>←</span><span>Arcade</span></a><div class="ag-copy"><div class="ag-eyebrow">09 / open source arcade</div><h1>Color Flood</h1><p>Flood the board from the top-left corner. Twenty-four moves, no more.</p></div><div class="ag-actions"><a class="ag-exit" href="/arcade/">exit</a><span class="ag-keys">CLICK / TAP A COLOR</span></div><div class="ag-scroll-cue" aria-hidden="true"><span>scroll down to play</span><span>↓</span></div></section>
  <section class="ag-game-shell">
    <div class="ag-toolbar">
      <div class="ag-hud" aria-label="Current game status">
        <div><span>moves</span><strong id="moves">0</strong></div>
        <div><span>limit</span><strong id="limit">24</strong></div>
        <div><span>filled</span><strong id="filled">0%</strong></div>
        <div><span>best</span><strong id="best">—</strong></div>
        <div><span>state</span><strong id="message">ready</strong></div>
      </div>
      <div class="ag-buttons"><button class="ag-btn" id="restart" type="button">new board</button></div>
    </div>
    <div class="ag-stage">
      <!-- game/moves/limit/filled/message/swatches are ids the vendor script looks up. -->
      <div class="ag-court"><canvas id="game" width="480" height="480"></canvas></div>
    </div>
    <div class="ag-swatches" id="swatches"></div>
  </section>
</main>
<script src="/arcade/color-flood/game.js"></script>
<script src="/arcade-hud.js"></script>
<script src="/flood-adapter.js"></script>
</body>
</html>
