<!doctype html>
<html lang="en">
<head>
  <!-- arcade:head -->
  <style>
    /* Passing the move limit is the one moment the game has to announce, and
       the HUD word alone is easy to miss mid-board. */
    #failFlash { position:absolute; inset:0; z-index:3; display:none; flex-direction:column;
      align-items:center; justify-content:center; gap:10px; pointer-events:none;
      background:radial-gradient(circle at 50% 50%, rgba(255,64,96,.22), rgba(5,6,16,.78));
      text-align:center; }
    #failFlash.is-on { display:flex; animation:fail-in .32s ease-out both; }
    #failFlash.is-out { animation:fail-out .5s ease-in both; }
    #failFlash b { padding:10px 26px; border:1px solid #ff4d6d; border-radius:999px;
      background:rgba(20,4,10,.82); color:#ff8ea3; font:700 30px/1 var(--mono);
      letter-spacing:.18em; text-transform:uppercase; box-shadow:0 0 34px rgba(255,77,109,.45); }
    #failFlash span { color:var(--text); font:12px var(--mono); letter-spacing:.09em;
      text-transform:uppercase; }
    @keyframes fail-in { from { opacity:0; transform:scale(1.08); } to { opacity:1; transform:scale(1); } }
    @keyframes fail-out { to { opacity:0; } }
    @media (prefers-reduced-motion: reduce) { #failFlash.is-on, #failFlash.is-out { animation:none; } }
  </style>
</head>
<body>
<main data-arcade="flood">
  <!-- arcade:intro -->
  <section class="ag-game-shell">
    <div class="ag-toolbar">
      <div class="ag-hud" aria-label="Current game status">
        <div><span>moves</span><strong id="moves">0</strong></div>
        <div><span>limit</span><strong id="limit">24</strong></div>
        <div><span>filled</span><strong id="filled">0%</strong></div>
        <div><span>best</span><strong id="best">—</strong></div>
        <div><span>state</span><strong id="message">ready</strong></div>
      </div>
      <div class="ag-buttons"><button class="ag-btn primary" id="restart" type="button">new game</button></div>
    </div>
    <div class="ag-stage">
      <!-- game/moves/limit/filled/message/swatches are ids the vendor script looks up. -->
      <div class="ag-court"><canvas id="game" width="480" height="480"></canvas><div id="failFlash" aria-hidden="true"><b>Failed</b><span>over 24 moves — play on</span></div></div>
    </div>
    <div class="ag-swatches" id="swatches"></div>
  </section>
</main>
<script src="/arcade/color-flood/game.js"></script>
<script src="/arcade-hud.js"></script>
<script src="/flood-adapter.js"></script>
</body>
</html>
