<!doctype html>
<html lang="en">
<head>
  <!-- arcade:head -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<main data-arcade="number-match">
  <!-- arcade:intro -->
  <section class="ag-game-shell nm-shell" aria-label="Number Match game">
    <div class="ag-toolbar">
      <div class="ag-hud" aria-label="Current game status">
        <div><span>score</span><strong id="score">0</strong></div>
        <div><span>stage</span><strong id="stage">1</strong></div>
        <div><span>left</span><strong id="remaining">0</strong></div>
        <div><span>best</span><strong id="best">0</strong></div>
      </div>
      <div class="ag-buttons">
        <select class="ag-btn" id="difficulty" aria-label="Difficulty">
          <option value="0">easy</option>
          <option value="1" selected>normal</option>
          <option value="2">hard</option>
        </select>
        <button class="ag-btn" id="new" type="button">new game</button>
      </div>
    </div>

    <div class="nm-stage">
      <div id="board" class="nm-board" aria-label="Number grid"></div>
      <div id="win" class="ag-overlay" hidden>
        <p class="ag-overlay-title" id="winStage">stage cleared</p>
        <p class="ag-overlay-score">score <strong id="winScore">0</strong></p>
        <button class="ag-btn" id="next" type="button">next stage →</button>
      </div>
    </div>

    <div class="nm-footer">
      <p id="status" role="status" aria-live="polite"></p>
      <div class="ag-buttons">
        <button class="ag-btn" id="undo" type="button">undo</button>
        <button class="ag-btn" id="hint" type="button">hint</button>
        <button class="ag-btn nm-add" id="add" type="button">+ add<span id="adds" class="nm-badge" aria-hidden="true">5</span></button>
      </div>
    </div>
  </section>
</main>
<script type="module" src="./main.js"></script>
</body>
</html>
