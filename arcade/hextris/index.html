<!doctype html>
<html lang="en">
<head>
  <!-- arcade:head -->
  <link rel="stylesheet" href="/arcade/hextris/style/fa/css/font-awesome.min.css"><link rel="stylesheet" href="/arcade/hextris/style/style.css"><link rel="stylesheet" href="/hextris-integration.css">
</head>
<body>
<main data-arcade="hextris">
  <!-- arcade:intro -->
  <section class="hextris-game-shell">
    <div class="ag-toolbar">
      <div class="ag-hud" aria-label="Current game status">
        <div><span>score</span><strong id="hextrisScoreValue">0</strong></div>
        <div><span>best</span><strong id="hextrisBestValue">0</strong></div>
        <div><span>state</span><strong id="hextrisStateValue">ready</strong></div>
      </div>
      <div class="ag-buttons hextris-controls">
        <button id="openSideBar" class="ag-btn ag-icon helpText" type="button" src="/arcade/hextris/images/btn_help.svg" aria-label="Help"></button>
        <button id="pauseBtn" class="ag-btn ag-icon" type="button" src="/arcade/hextris/images/btn_pause.svg" aria-label="Pause"></button>
        <button id="restartBtn" class="ag-btn primary" type="button" src="/arcade/hextris/images/btn_restart.svg">new game</button>
      </div>
    </div>
    <div id="hextris-stage">
      <canvas id="canvas"></canvas><div id="overlay" class="faded overlay"></div><div id="startBtn"></div><div id="helpScreen" class="unselectable"><div id="inst_main_body"></div></div>
      <div id="highScoreInGameText"><div id="highScoreInGameTextHeader">HIGH SCORE</div><div id="currentHighScore">0</div></div>
      <div id="gameoverscreen"><div id="container"><div id="gameOverBox" class="GOTitle">GAME OVER</div><div id="cScore">0</div><div id="highScoresTitle" class="GOTitle">HIGH SCORES</div><div class="score"><span class="scoreNum">1.</span> <div id="1place" style="display:inline">0</div></div><div class="score"><span class="scoreNum">2.</span> <div id="2place" style="display:inline">0</div></div><div class="score"><span class="scoreNum">3.</span> <div id="3place" style="display:inline">0</div></div></div><div id="bottomContainer"><img id="restart" src="/arcade/hextris/images/btn_restart.svg" height="57" alt="Restart"><div id="socialShare"></div><div id="buttonCont"></div></div></div>
    </div>
    <p class="ag-hint">top edge: swipe to return</p>
  </section>
</main>
<script src="/arcade/hextris/vendor/hammer.min.js"></script><script src="/arcade/hextris/vendor/js.cookie.js"></script><script src="/arcade/hextris/vendor/jsonfn.min.js"></script><script src="/arcade/hextris/vendor/keypress.min.js"></script><script src="/arcade/hextris/vendor/jquery.js"></script>
<script src="/arcade/hextris/js/save-state.js"></script><script src="/arcade/hextris/js/view.js"></script><script src="/arcade/hextris/js/wavegen.js"></script><script src="/arcade/hextris/js/math.js"></script><script src="/arcade/hextris/js/Block.js"></script><script src="/arcade/hextris/js/Hex.js"></script><script src="/arcade/hextris/js/Text.js"></script><script src="/arcade/hextris/js/comboTimer.js"></script><script src="/arcade/hextris/js/checking.js"></script><script src="/arcade/hextris/js/update.js"></script><script src="/arcade/hextris/js/render.js"></script><script src="/arcade/hextris/js/input.js"></script><script src="/arcade/hextris/js/main.js"></script><script src="/arcade/hextris/js/initialization.js"></script><script src="/arcade/hextris/vendor/sweet-alert.min.js"></script>
<script src="/hextris-status-adapter.js"></script>
</body>
</html>
