<!doctype html>
<html lang="en">
<head>
  <!-- arcade:head -->
  <link rel="stylesheet" href="/tetris-integration.css">
</head>
<body>
<main data-arcade="tetris">
  <!-- arcade:intro -->
  <section class="tetris-game-shell">
    <div class="tetris-toolbar">
      <div class="tetris-stage-hud" aria-label="Current game status">
        <div id="menu" class="tetris-next"><span>next</span><canvas id="upcoming"></canvas><p hidden>score <span id="score">00000</span></p><p hidden>rows <span id="rows">0</span></p></div>
        <div><span>score</span><strong id="tetrisScoreValue">0</strong></div>
        <div><span>rows</span><strong id="tetrisRowsValue">0</strong></div>
        <div><span>best</span><strong id="tetrisBestValue">0</strong></div>
        <div><span>state</span><strong id="tetrisStateValue">ready</strong></div>
      </div>
    </div>
    <div id="tetris-stage">
      <!-- canvas/start here and menu/upcoming/score/rows in the HUD are IDs the vendor script looks up. -->
      <div id="tetris">
        <div class="tetris-court">
          <canvas id="canvas"></canvas>
          <p id="start"><a href="javascript:play();">Press Space to Play.</a></p>
        </div>
      </div>
    </div>
    <p class="tetris-gesture-hint">tap rotate · drag move · flick down drop</p>
  </section>
</main>
<script src="/arcade/tetris/stats.js"></script><script src="/arcade/tetris/tetris.js"></script>
<script src="/tetris-status-adapter.js"></script>
</body>
</html>
