<!doctype html>
<html lang="en">
<head>
  <!-- arcade:head -->
</head>
<body>
<main data-arcade="suika">
  <!-- arcade:topbar-extra --><button class="ag-btn" id="restart" type="button">new game</button><!-- /arcade:topbar-extra -->
  <!-- arcade:intro -->
  <section class="ag-game-shell ag-bleed">
    <div class="ag-toolbar">
      <div class="ag-hud" aria-label="Current game status">
        <div><span>score</span><strong id="score">0</strong></div>
        <div><span>best</span><strong id="best">0</strong></div>
        <div><span>next</span><strong><img id="next" class="ag-next-fruit" src="/arcade/suika/assets/img/circle0.png" alt="Next fruit"></strong></div>
        <div><span>state</span><strong id="message">ready</strong></div>
      </div>
    </div>
    <div class="ag-stage">
      <!-- game/score/best/next/message are ids the vendor script looks up; it
           appends its own canvas to #game. -->
      <div class="ag-court"><div id="game"></div>
        <div class="ag-overlay" id="gameover" hidden>
          <p class="ag-overlay-title">Game over</p>
          <p class="ag-overlay-score"><span>score</span><strong id="final">0</strong></p>
          <button class="ag-btn" id="again" type="button">play again</button>
        </div>
      </div>
    </div>
    <p class="ag-hint">drag to aim · lift to drop</p>
  </section>
</main>
<script src="/arcade/suika/matter.js"></script>
<script src="/arcade/suika/game.js"></script>
<script src="/arcade-hud.js"></script>
<script src="/suika-adapter.js"></script>
</body>
</html>
